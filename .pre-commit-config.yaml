# The checks CI runs (.github/workflows/ci.yml). Run them locally with:
#   uvx pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Without these two flags, the hooks only look at staged files or an
      # in-progress merge, so in CI they would check nothing.
      - id: check-added-large-files
        args: [--enforce-all]
      - id: check-case-conflict
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
        # These two fixtures are deliberately unparseable (checks/tests).
        exclude: ^checks/tests/fixtures/broken/(yaml-error|duplicate-key)/
      # schema/generated/ must match its generator byte for byte (schema/tests
      # checks that), so the whitespace fixers leave it alone.
      - id: end-of-file-fixer
        exclude: ^schema/generated/
      - id: mixed-line-ending
        exclude: ^schema/generated/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^schema/generated/
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-citation-file-format
      - id: check-dependabot
      - id: check-github-issue-forms
      - id: check-github-workflows-require-timeout
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: linkml-lint
        name: LinkML lint (schema/axonarium.yaml)
        entry: uv run --frozen linkml-lint -c .linkmllint.yaml schema/axonarium.yaml
        language: system
        files: ^(schema/axonarium\.yaml|\.linkmllint\.yaml)$
        pass_filenames: false
      - id: schema-tests
        name: Schema, data-check and build tests
        entry: uv run --frozen pytest -q schema/tests checks/tests build/tests ingest/tests
        language: system
        files: ^(schema/|checks/|build/|ingest/|data/|pyproject\.toml|uv\.lock)
        pass_filenames: false
      - id: mcp-tests
        name: MCP server tests
        entry: uv run --frozen --directory api/mcp pytest -q -p no:cacheprovider
        language: system
        files: ^api/mcp/
        pass_filenames: false
      - id: data-checks
        name: Data checks (python -m checks files)
        entry: uv run --frozen python -m checks files
        language: system
        files: ^(data/|checks/|schema/axonarium\.yaml)
        pass_filenames: false
