  - {structure: 1020, term: UBERON:0002264, label: olfactory bulb}
  - {structure: 502, term: UBERON:0002893, label: nucleus of lateral olfactory tract}
  - {structure: 506, term: UBERON:0002266, label: anterior olfactory nucleus}
