# The bridge from UBERON to the Waxholm rat atlas (ADR 0034, "Rat in 3D"; build/waxholm.py). UBERON's own bridges
# cover the Allen atlases but not Waxholm, so this one is kept by hand and reviewed like the modules.
#
# Each row pairs a structure of the pinned Waxholm atlas (data/entities/atlases/waxholm-sd-rat-v4.yaml, by its
# BrainGlobe ID) with the UBERON term for it, and UBERON's label for the term. The file holds IDs only, no Waxholm
# names; the build reads those from the atlas. A UBERON term that rat claims name is drawn on the structure of the
# most specific row whose term it is or falls under, so a nucleus Waxholm doesn't delineate takes the structure
# around it: the amygdala's nuclei share Waxholm's one amygdaloid area. A structure may draw several terms.
#
# The build stops if a row names a structure the atlas lacks or a term OLS doesn't know, or lists a term twice, and
# warns if UBERON has relabelled a term.
bridge:
