name: Scout

# The scout (sprint 2.2, ADR 0019): run the saved literature searches in corpus/queries.yaml and push an updated
# corpus/manifest.csv to a scout/<date> branch for review. A pull request opened with this workflow's token wouldn't
# run CI, so the maintainer opens it from the branch. Run it from the Actions tab; a weekly schedule comes with Phase 6.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # to push the scout/<date> branch; never main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Run the saved queries
        shell: bash  # -o pipefail, so a failed scout fails the step despite tee
        run: uv run --frozen python -m ingest.scout | tee scout.txt
      - name: Push the manifest to a branch for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; cat scout.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- corpus/manifest.csv && git ls-files --error-unmatch corpus/manifest.csv >/dev/null 2>&1; then
            echo "No change to the corpus." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="scout/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add corpus/manifest.csv
          git commit -q -m "Scout: corpus manifest of $(date -u +%Y-%m-%d)" -m "$(cat scout.txt)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          echo "Pushed **${branch}**: open a pull request from it." >> "$GITHUB_STEP_SUMMARY"
