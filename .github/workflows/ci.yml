name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Online checks of a large data pull request take minutes.
    permissions:
      contents: read
    services:
      postgres:  # An empty database for the rebuild and the build's database tests.
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: postgres  # A throwaway CI database, reachable only from this job.
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXONARIUM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # The change gate below compares against the base branch.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:  # The build's API answers (seven days) and BrainGlobe's atlases, so an outage doesn't block merging.
          path: |
            .cache/build
            ~/.brainglobe
          key: build-http-${{ github.run_id }}
          restore-keys: build-http-
      - name: Migrate and rebuild an empty database
        env:
          AXONARIUM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
          uv run --frozen python -m build --http-cache .cache/build --report reconciliation
      - name: Reconciliation report in the run's summary (sprint 1.6)
        run: cat reconciliation/reconciliation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the reconciliation report and figure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconciliation
          path: reconciliation/
          retention-days: 30
          if-no-files-found: error
      - run: uvx pre-commit@4.6.2 run --all-files --show-diff-on-failure
      - name: Deletions and retractions are logged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --frozen python -m checks changes --base "origin/$BASE_REF"
      - name: Identifiers and citations resolve
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # The cache lives outside the checkout, so answers committed in a pull request are never read.
        run: uv run --frozen python -m checks online --base "origin/$BASE_REF" --cache "$RUNNER_TEMP/checks-cache"

  screen:  # The hidden-text screen's real classifier on its planted and clean fixtures (sprint C.5, ADR 0023).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agents
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:  # The pinned model (about 740 MB); injection.py holds its revision.
          path: ~/.cache/huggingface/hub
          key: screen-model-${{ hashFiles('agents/screen/injection.py') }}
      - name: The real classifier passes the screen's fixtures
        env:
          AXONARIUM_SCREEN_MODEL: "1"
        run: uv run --frozen pytest -q -p no:cacheprovider screen/tests/test_model.py

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build  # without the Supabase variables: pages render their "data unavailable" notice
