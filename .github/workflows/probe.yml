name: Probe (temporary)

on:
  push:
    branches: [claude/probe-data]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 probe.py whitetext
      - run: python3 probe.py mouselight
