name: Deploy

# Every merge to main rebuilds the live database from the files (design principle 2), then deploys the site with a
# snapshot of that database to answer from when Supabase can't (ADR 0017).
# Never runs on pull requests, so no secret is ever exposed to one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  database:
    name: Rebuild the Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production  # Its secrets are released only to jobs running on main.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.22"
          enable-cache: false
      - name: Migrate, build and load
        env:
          AXONARIUM_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$AXONARIUM_DATABASE_URL" ]; then
            echo "::notice::The SUPABASE_DB_URL secret isn't set, so only the dumps were built."
          else
            uv run --frozen alembic upgrade head
          fi
          uv run --frozen python -m build --meshes brain-meshes --snapshot snapshot/snapshot.json
      - name: Keep the brain meshes for the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brain-meshes
          path: brain-meshes/
          retention-days: 1
          if-no-files-found: error
      - name: Keep the database snapshot for the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: snapshot/
          retention-days: 1
          if-no-files-found: error

  site:
    name: Deploy the site to Vercel
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Public by design. With TURNSTILE_SECRET_KEY and SUPABASE_SECRET_KEY in Vercel's settings, opens submissions (ADR 0024).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Brain meshes from the database build (ADR 0011)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brain-meshes
          path: site/public/brain
      - name: The database snapshot, the site's fallback when Supabase can't answer (ADR 0017)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: site/snapshot
      - name: Build and deploy (Vercel CLI, prebuilt)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@62.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@62.2.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@62.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
