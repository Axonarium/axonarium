name: Literature

# The literature pipeline (ADR 0028): one step on up to `limit` papers, on the Batch API, then a literature/<step>
# branch for review. `extract-and-verify` runs both, so the claims arrive already checked, in one pull request. Started by hand from the Actions tab on main. The key is the `models` environment's secret, which
# only main may use, so pull requests never see it. A pull request opened with this workflow's token wouldn't run CI,
# so it is opened from the branch.
on:
  workflow_dispatch:
    inputs:
      step:
        description: Which step
        type: choice
        options: [triage, extract, verify, extract-and-verify]
        default: triage
      limit:
        description: At most this many papers
        type: number
        default: 50
      model:
        description: provider:model
        type: string
        default: anthropic:claude-opus-5-5
      collect:
        description: An earlier run's batch ID (msgbatch_…), or latest for the step's last batch, to collect instead of sending a new batch; leave empty otherwise
        type: string
        default: ""
      redo:
        description: Papers to read again though this step finished them (DOIs, PubMed or PMC IDs; older; all); usually empty
        type: string
        default: ""

permissions: {}

concurrency:
  group: literature
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360  # a batch can take hours; most finish within one
    environment: models
    permissions:
      contents: write  # to push the literature/<step> branch; never main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # every branch: a run refuses to start while another holds results not yet merged
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.step != 'triage'
        with:  # the CI build's atlases and API answers, for the region lexicon
          path: |
            .cache/build
            ~/.brainglobe
          key: build-http-${{ github.run_id }}
          restore-keys: build-http-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.step != 'triage'
        with:  # the hidden-text screen's pinned model, as the CI screen job caches it
          path: ~/.cache/huggingface/hub
          key: screen-model-${{ hashFiles('agents/screen/injection.py') }}
      - name: The region lexicon (never committed; ADR 0005)
        if: inputs.step != 'triage'
        run: uv run --frozen python -m ingest.lexicon --out .cache/lexicon.json --http-cache .cache/build
      - name: Run the step
        working-directory: agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STEP: ${{ inputs.step }}
          LIMIT: ${{ inputs.limit }}
          MODEL: ${{ inputs.model }}
          COLLECT: ${{ inputs.collect }}
          REDO: ${{ inputs.redo }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          # The job may run 360 minutes. Batches are waited for until 330 minutes after this step starts, which leaves
          # time for the checks and the push; a batch still running then is collected later (`collect`).
          deadline=$(( $(date +%s) + 330 * 60 ))
          minutes_left() { echo $(( (deadline - $(date +%s)) / 60 )); }
          if [ "$STEP" != extract-and-verify ]; then
            uv run --frozen python -m pipeline "$STEP" --limit "$LIMIT" --model "$MODEL" --wait "$(minutes_left)" ${COLLECT:+--collect "$COLLECT"} ${REDO:+--redo "$REDO"}
            exit
          fi
          if [ -n "$COLLECT" ]; then
            echo "A batch is collected by the step that sent it: choose extract or verify." >&2
            exit 1
          fi
          uv run --frozen python -m pipeline extract --limit "$LIMIT" --model "$MODEL" --wait "$(minutes_left)" ${REDO:+--redo "$REDO"}
          # Extraction's claims are paid for, so they are pushed whatever happens to verification: its batch may outlive
          # the job (exit 3), or it may stop, for one because another branch holds verification results not yet merged.
          status=0
          uv run --frozen python -m pipeline verify --limit "$LIMIT" --model "$MODEL" --wait "$(minutes_left)" ${REDO:+--redo "$REDO"} || status=$?
          if [ "$status" -eq 3 ]; then
            echo "The extracted claims are pushed unverified. Once their pull request merges, run **verify** with that batch's ID as its collect input." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            echo "Verification stopped (exit $status; see its message above). The extracted claims are pushed unverified: once their pull request merges, run **verify**." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Source records for newly cited papers, then the data checks
        if: inputs.step != 'triage'
        run: |
          uv run --frozen python -m checks sources
          { echo '### Data checks'; echo '```'; uv run --frozen python -m checks files 2>&1 | tail -50 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push the results to a branch for review
        env:
          GH_TOKEN: ${{ github.token }}
          STEP: ${{ inputs.step }}
        run: |
          if [ -z "$(git status --porcelain -- corpus data)" ]; then
            echo "Nothing changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="literature/${STEP}-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add corpus data
          git commit -q -m "Literature: ${STEP} of $(date -u +%Y-%m-%d)" -m "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          echo "Pushed **${branch}**: open a pull request from it." >> "$GITHUB_STEP_SUMMARY"
