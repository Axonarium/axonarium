version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /api/mcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      mcp:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:  # Minor and patch updates together; each major update gets its own pull request.
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "@types/node"  # Match the runtime: the site runs on Node 24 (Vercel, CI).
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript  # typescript-eslint doesn't support TypeScript 7 yet.
        update-types: ["version-update:semver-major"]
