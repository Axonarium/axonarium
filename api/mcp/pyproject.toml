[project]
name = "axonarium-mcp"
version = "0.1.0"
description = "An MCP server over Axonarium's read API: brain connectivity with citations, for AI agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx==0.28.1"]

[project.scripts]
axonarium-mcp = "axonarium_mcp.server:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
