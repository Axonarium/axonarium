# The repo's own tooling environment (schema tools and tests). Never published.
[project]
name = "axonarium-repo"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
schema = ["linkml==1.11.1"]
dev = [
    "pytest==9.1.1",
    "pytest-httpserver==1.1.5",
]
build = [
    "alembic==1.20.0",
    "brainglobe-atlasapi==3.0.2",
    "fast-simplification==0.2.0",
    "matplotlib==3.11.2",
    "psycopg[binary]==3.3.6",
    "rdflib==7.6.0",
    "requests==2.34.2",
    "requests-cache==1.3.3",
    "requests-ratelimiter==0.10.0",
    "sqlalchemy==2.1.3",
    "trimesh==5.1.1",
]

[tool.uv]
package = false
default-groups = ["schema", "dev", "build"]

[tool.pytest.ini_options]
# pytest skips folders named build by default; list the suites so a bare `pytest` runs what CI runs.
testpaths = ["schema/tests", "checks/tests", "build/tests", "ingest/tests"]
