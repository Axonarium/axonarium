paraphrase: Red-light pulsed activation (5–40 Hz) of VTA axon terminals in the BLA, including Cre-dependent expression restricted
  to dopamine transporter-expressing VTA neurons, produced phase-locked BLA local field potential oscillations and increased
  power at the stimulation frequencies. Imaging a genetically encoded dopamine sensor in the BLA showed that the same terminal
  stimulation evoked dopamine release above baseline within one second, indicating a dopaminergic modulatory input; this response
  was blunted after early life stress.
