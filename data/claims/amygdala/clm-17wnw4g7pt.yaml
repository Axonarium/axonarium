paraphrase: Light activation of ChR2-expressing ACC axons in slices evoked short-latency PSPs in BLA neurons. The PSPs persisted
  in TTX plus 4-AP, consistent with a monosynaptic input, and were abolished by NBQX plus APV, showing they are glutamatergic.
  Results were replicated in wild-type mice with CaMKIIa-ChR2 in the ACC.
