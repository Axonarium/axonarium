paraphrase: Optogenetic activation of PrL glutamatergic axon terminals in the BLA lowered mechanical thresholds in control
  mice, and this effect was abolished when BLA glutamatergic neurons were chemogenetically silenced; conversely, silencing
  PrL terminals in BLA raised thresholds in tumour-bearing mice and this was reversed by chemogenetic excitation of BLA glutamatergic
  neurons. A glutamate sensor in the BLA showed that chemogenetic inhibition of PrL VGluT2+ neurons reduced evoked glutamate
  release in the BLA, indicating an excitatory PrL-to-BLA functional connection.
