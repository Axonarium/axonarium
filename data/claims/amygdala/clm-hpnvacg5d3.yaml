paraphrase: Blue light activation of ChR2-expressing LPB fibers evoked short-latency, low-jitter EPSCs in CeC neurons of all
  firing types. These EPSCs were abolished by TTX, restored by 4AP and blocked by kynurenic acid, indicating monosynaptic
  glutamatergic input. They were followed by a polysynaptic, bicuculline-sensitive feed-forward IPSC. In late-firing neurons,
  EPSC amplitude was increased 24 h after intraplantar formalin.
