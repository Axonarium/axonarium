paraphrase: With ChR2 expressed in mPFC and DRN neurons retrogradely labelled from mPFC, light stimulation of mPFC axons within
  DRN evoked excitatory postsynaptic currents in mPFC-projecting 5-HT neurons (recorded with picrotoxin present); these currents
  were abolished by TTX and restored by 4-AP, indicating a direct monosynaptic glutamatergic input. Amplitudes averaged about
  47 pA in controls and were larger in prenatally ethanol-exposed rats, which also showed a reduced paired-pulse ratio; the
  NO donor SNAP potentiated these currents in controls.
