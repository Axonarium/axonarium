paraphrase: Fluorescent dextran injected into CeA retrogradely labelled neurons throughout the dorsoventral extent of LC,
  with a bias toward the dorsal part; in the same animals only about 7.6% of all labelled LC cells carried both the CeA and
  mPFC tracers, indicating largely separate populations. A retrogradely transported CAV2 vector with a noradrenergic-selective
  PRS promoter injected into CeA also transduced LC neurons, confirming the pathway arises from noradrenergic LC cells.
