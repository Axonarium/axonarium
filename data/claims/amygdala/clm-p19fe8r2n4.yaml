paraphrase: An AAV carrying the channelrhodopsin variant oChIEF-tdTomato was injected bilaterally into the medial geniculate
  nucleus (and auditory cortex); four weeks later the opsin was present in axon terminals in the LA. Brief blue-light pulses
  delivered through an optrode placed in the LA of anaesthetized mice evoked field postsynaptic responses, which were potentiated
  by a high-frequency light protocol (to ~149% of baseline) and depressed by a 1 Hz light protocol (to ~77% of baseline) in
  both floxed GR and LAGRKO mice.
