paraphrase: In DAT-Cre mice in which ChrimsonR was restricted to dopaminergic VTA neurons, red-light stimulation through an
  implanted LED array in the VTA raised extracellular dopamine measured by microdialysis/HPLC in the nucleus accumbens shell;
  the increase was larger at 20 Hz than at 2 Hz (paired t-test p = 0.000116 at 2 Hz and p = 0.00599 at 20 Hz for the 15-min
  sample immediately after stimulation). Immunostaining confirmed ChrimsonR/TH co-localization and c-fos induction in these
  neurons after stimulation.
