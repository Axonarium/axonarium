paraphrase: In urethane-anesthetized rats, electrical stimulation of BLA evoked, in GC regular-spiking neurons recorded intracellularly,
  an early depolarizing PSP that grew with stimulus intensity. Its early component reversed near the glutamatergic (AMPA-type)
  reversal potential, consistent with a likely monosynaptic excitatory input. It was followed by a slower, likely multisynaptic
  hyperpolarization that reversed near the GABA-A reversal potential.
