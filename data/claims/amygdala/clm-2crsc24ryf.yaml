paraphrase: 'Optogenetic stimulation of locus coeruleus neurons redistributed which odor-activated basolateral amygdala neurons
  expressed cFos: 10-Hz phasic light favoured accumbens-projecting cells while 25-Hz tonic light favoured central-amygdala-projecting
  cells, with total cFos counts unchanged. Light alone without odor did not change BLA cFos patterns, and intra-BLA α- and
  β-adrenoceptor antagonists abolished the conditioned odor preference and aversion driven by these LC patterns, indicating
  a noradrenergic modulatory action.'
