paraphrase: About 85% of the Fos-positive nuclei driven in the medial basolateral amygdala by prefrontal D1 photostimulation
  were CaMKII-positive (roughly 20% of CaMKII cells in this territory). Silencing these CaMKII neurons with halorhodopsin
  and yellow light abolished the feeding increase produced by blue-light stimulation of the prefrontal D1 terminals, indicating
  that the prefrontal input acts through these amygdala glutamatergic cells.
