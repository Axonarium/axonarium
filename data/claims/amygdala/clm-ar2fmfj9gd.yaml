paraphrase: Bipolar electrical stimulation of the medial prefrontal cortex (electrode in infralimbic cortex, possible spread
  to prelimbic) reliably evoked single spikes in putative projection neurons of the lateral and basolateral amygdala in anesthetized
  rats; 11 responsive neurons were found in Exp 1 and 9 in Exp 2. Only units with onset latencies under 30 ms, little latency
  shift with increasing intensity and low jitter were kept, which the authors take as monosynaptic and not antidromic; stimulus
  current was titrated so that baseline evoked spike probability was about 0.5 of 50 trials (49.3 ± 3.6% before and 50.3 ±
  7.6% after drug application in 6 neurons).
