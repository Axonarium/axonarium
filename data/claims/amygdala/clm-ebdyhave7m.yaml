paraphrase: 'Electrical stimulation of the LPB fiber tract running ventromedial to the CeC in mouse amygdala slices evoked
  excitatory postsynaptic currents in whole-cell recorded CeC neurons. The responses were glutamatergic: the pharmacologically
  isolated NMDA-receptor component was abolished by APV (50 microM) in all 20 neurons tested, and the isolated AMPA-receptor
  component was abolished by CNQX, indicating a functional glutamatergic LPB-to-CeC synaptic input whose NMDA component is
  potentiated by CGRP via CGRP1 receptors and PKA.'
