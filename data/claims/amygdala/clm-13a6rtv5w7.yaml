paraphrase: Electrical stimulation with an electrode placed in the ventral BLA close to the CeA border evoked short, stable-latency
  excitatory postsynaptic currents in CeC/L neurons held at -70 mV in brain slices from naive, saline- and formalin-treated
  mice. Pregabalin reduced these BLA-evoked EPSCs and raised the paired-pulse ratio only in formalin-treated animals, indicating
  a presynaptic site of action at BLA terminals; EPSC amplitude at fixed 100 µA stimulation did not differ between saline
  and formalin groups.
