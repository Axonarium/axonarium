paraphrase: Light pulses delivered in the ventral hippocampus after ChR2 expression in the BLA produced only short-latency
  evoked potentials, consistent with direct axonal input, detectable about 11 days after injection. Local infusion of the
  AMPA-receptor antagonist CNQX through the probe suppressed the optically evoked response and abolished the stimulation-induced
  behavioural change, indicating a glutamatergic synaptic connection.
