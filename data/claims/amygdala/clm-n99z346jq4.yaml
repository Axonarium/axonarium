paraphrase: After WGA-HRP was injected into one side of the DVC in asthmatic rats, retrogradely labelled cells appeared in
  the PVN, dense in its medial and lateral subnuclei and scattered in the dorsal subnucleus. Across 8 rats, 634 HRP-labelled
  PVN neurons were counted; about 18.14% were HRP/OT and 2.37% HRP/Fos/OT, so roughly a fifth of DVC-projecting PVN neurons
  were oxytocin-positive.
