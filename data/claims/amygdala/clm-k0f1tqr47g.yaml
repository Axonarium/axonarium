paraphrase: In spinal cord slices with attached L4 dorsal root from ChR2 transgenic rats, blue light applied to the dorsal
  root evoked monosynaptic excitatory postsynaptic currents in lamina II dorsal horn neurons; the afferents driving these
  responses conducted at about 19.5 m/s (SEM 1.7, n = 17 fibers), within the Aβ range, and light pre-stimulation blocked the
  electrically evoked Aβ response, confirming that light drives these fibers.
