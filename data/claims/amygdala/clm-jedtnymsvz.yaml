paraphrase: 'Photostimulation (30 Hz, up to 30 s) of channelrhodopsin-expressing lateral hypothalamic orexin/dynorphin terminals
  in slices bidirectionally changed evoked firing of tyrosine hydroxylase-positive VTA neurons: some cells fired more, others
  less, and a minority were unaffected. The increases persisted with glutamate and GABA-A blockers and were reversed by the
  orexin-1 receptor antagonist SB334867, the decreases were reversed by the kappa-opioid antagonist NorBNI, and combined antagonists
  abolished any change, indicating peptidergic (orexin and dynorphin) postsynaptic modulation rather than fast transmission.'
