paraphrase: Photostimulation of ChR2-expressing auditory cortical axons in the LA evoked glutamatergic EPSCs in LA pyramidal
  cells, with 79% of recorded neurons responding when only AuV was infected (84% when AuV and MGm were both infected, N =
  50 cells). EPSCs were blocked by kynurenic acid, and in vivo photostimulation of AuV evoked LA field potentials at a 12-ms
  latency, which were strongly reduced by intra-LA kynurenic acid.
