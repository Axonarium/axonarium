paraphrase: Optical activation of ChR2- or ChrimsonR-expressing NBM terminals just before electrical stimulation of stria
  terminalis fibres lowered the paired-pulse ratio of glutamatergic EPSCs in BLA pyramidal neurons of air-exposed rats, an
  effect reversed by the nicotinic antagonist mecamylamine and mimicked by physostigmine; optical inhibition of NBM terminals
  with halorhodopsin raised the paired-pulse ratio in ethanol-withdrawn rats. This shows NBM terminals modulate glutamate
  release in the BLA through presynaptic nicotinic receptors.
