paraphrase: ChR2 expression in lateral habenula allowed light activation of LHb fibres in DRN, which evoked excitatory currents
  in mPFC-projecting 5-HT neurons that were blocked by TTX and rescued by 4-AP, showing a direct monosynaptic glutamatergic
  LHb input. Amplitudes (~47 pA in controls) and paired-pulse ratios were unchanged by prenatal ethanol, and the NO donor
  SNAP did not modulate these currents.
