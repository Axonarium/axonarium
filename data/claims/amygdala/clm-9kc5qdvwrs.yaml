paraphrase: When ChrimsonR was expressed non-specifically (CamKIIa promoter in wild-type mice, labelling both dopaminergic
  and GABAergic VTA cells), photo-stimulation of the VTA did not change accumbal dopamine (p = 0.0677 at 2 Hz, p = 0.416 at
  20 Hz). After systemic bicuculline, the same non-specific VTA stimulation significantly increased dopamine in the NAcShell
  (p = 0.00452 at 2 Hz, p = 0.000243 at 20 Hz), so a functional VTA-to-NAcShell dopaminergic link exists but is masked by
  local GABAergic inhibition. Light delivery alone in control mice without ChrimsonR produced no change (p = 0.0923 and 0.129).
