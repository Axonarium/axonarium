paraphrase: In urethane-anesthetized rats, high-frequency electrical stimulation of the BLA produced a long-lasting suppression,
  beginning within 10 min and lasting over 60 min, of tail-pressure-evoked nociceptive unit responses recorded in cingulate
  and prelimbic mPFC (9 units in 9 rats). This suppression was prevented by NMDA and group II mGluR antagonists and by D2
  or D4 antagonists injected into the PFC.
