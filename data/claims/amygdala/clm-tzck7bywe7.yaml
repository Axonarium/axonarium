paraphrase: Unilateral in vivo blue-light stimulation of ChR2-expressing PACAP BMA neurons that project to the mICCs raised
  the number of cfos-positive cells in the ipsilateral mICCs relative to the unstimulated hemisphere. In slices, single light
  flashes over ChR2-expressing BMA PACAPergic fibres evoked EPSCs in most recorded mICC neurons; these were abolished by TTX,
  restored/increased by TTX plus 4-AP (consistent with a monosynaptic connection), and blocked by CNQX, showing glutamate
  release from BMA terminals. The PAC1 antagonist PACAP 6-38 increased EPSC amplitude without changing the paired-pulse ratio.
