paraphrase: Blue-light stimulation of ChR2-expressing BLA glutamatergic terminals evoked postsynaptic currents in layer II/III
  ACC pyramidal neurons that were abolished by the AMPA-receptor blocker CNQX; the responses were eliminated by TTX and restored
  by TTX plus 4-AP, indicating a direct monosynaptic excitatory input. In the pain/anxiety model these light-evoked currents
  were larger and the paired-pulse ratio was lower than in controls.
