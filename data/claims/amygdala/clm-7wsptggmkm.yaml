paraphrase: Optogenetic silencing (ArchT, 532 nm, 2.5 s) of BLA axon terminals within GC altered taste-evoked firing in 78
  of 140 recorded GC neurons, either suppressing (56%) or enhancing (44%) responses; putative interneurons were almost always
  suppressed (19/21) whereas only about half of putative pyramidal cells were suppressed. The perturbation reduced late-epoch
  palatability-correlated firing and flattened the ensemble transition into the palatability state, while leaving taste-identity
  coding largely intact. Effect latencies peaked near 347 ms and 754 ms after taste delivery, unlike the immediate effects
  of silencing GC somata, arguing the effects were mediated by the BLA-to-GC pathway.
