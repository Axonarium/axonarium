paraphrase: Light activation of ChR2+ BLA axons in slices evoked EPSCs in IL neurons that mostly persisted in TTX/4-AP, indicating
  monosynaptic excitation. IPSCs were abolished by the blockers, so the inhibition was polysynaptic. Monosynaptic input was
  larger in L5 cortico-PAG neurons than in L3/5 corticoamygdalar neurons, and larger in L3/5 than in L2 corticoamygdalar neurons.
