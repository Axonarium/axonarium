paraphrase: Light activation of ChR2-expressing rBLA axons in slices evoked monosynaptic glutamatergic currents (isolated
  with TTX, 4-AP and raised Ca2+) that were far larger in PL layer 2 cortico-amygdalar neurons than in any other recorded
  projection neuron, and sCRACM showed the input lands on basal and perisomatic dendrites. In current clamp these inputs reliably
  drove action potentials (firing probability 0.88 ± 0.05, 8 pairs). Responses were also larger at PL L2 CA cells than neighbouring
  L2 cortico-cortical cells.
