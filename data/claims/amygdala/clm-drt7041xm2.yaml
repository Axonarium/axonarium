paraphrase: In amygdala slices, electrical stimulation of the fiber tract carrying parabrachial afferents ventromedial to
  the central amygdala evoked graded compound EPSCs in capsular central amygdala neurons recorded in whole-cell mode, with
  GABA-A and glycine transmission blocked, indicating a glutamatergic excitatory input; minimal stimulation with theta pipettes
  evoked all-or-none single-fiber EPSCs in the same neurons, and right-side EPSC amplitudes were enlarged after spinal nerve
  ligation in vehicle-treated but not neonatally capsaicin-treated rats.
