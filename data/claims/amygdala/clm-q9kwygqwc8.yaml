paraphrase: A conditioning electrical pulse in the lateral orbitofrontal cortex reduced the probability that mPFC stimulation
  evoked a spike in lateral/basolateral amygdala neurons, with significant suppression at lOFC-mPFC delays of 25-500 ms and
  no effect at 1000 ms. Nine of 11 neurons in Exp 1 and all 9 in Exp 2 were suppressed by the lOFC prepulse. Local iontophoresis
  of the GABA-A antagonist bicuculline abolished the suppression at both 25 and 100 ms delays, whereas the GABA-B antagonist
  saclofen reversed it only at the 100 ms delay, indicating the gating is mediated by intra-amygdala GABA receptors. Three
  of the 9 gated neurons in Exp 1 also received direct convergent input from the lOFC.
