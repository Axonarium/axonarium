paraphrase: Blue-light activation of ChR2-expressing NBM terminals evoked short-latency EPSCs in BLA pyramidal neurons that
  were abolished by TTX and restored by 4-AP, indicating a monosynaptic connection; the EPSC was eliminated by DNQX plus mecamylamine,
  showing both glutamatergic and nicotinic components. Optical silencing of NBM terminals with halorhodopsin reduced the elevated
  firing of BLA pyramidal neurons after chronic ethanol withdrawal.
