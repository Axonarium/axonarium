paraphrase: Stimulating the fiber bundle of LPB origin running dorsomedial to the CeA evoked short-latency excitatory postsynaptic
  currents in CeC/L neurons recorded at -70 mV; these responses were larger in formalin-treated than saline-treated mice and,
  unlike BLA-evoked responses, were unaffected by pregabalin. Both LPB- and BLA-evoked EPSCs could be recorded in the same
  CeC/L neurons, showing convergence of the two inputs.
