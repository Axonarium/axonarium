paraphrase: Non-specific photo-stimulation of VTA neurons, which co-activated VGAT-positive GABAergic cells (shown to express
  ChrimsonR in Fig. 4h), failed to raise accumbal dopamine, whereas blocking GABA-A receptors with intraperitoneal bicuculline
