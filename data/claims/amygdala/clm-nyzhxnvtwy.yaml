paraphrase: oChIEF-tdTomato was expressed in auditory cortex neurons (together with the medial geniculate nucleus) by bilateral
  AAV injection, and the opsin reached axon terminals in the LA. Light pulses applied in the LA elicited field synaptic responses
  that were enhanced by an optical LTP protocol and reduced by an optical LTD protocol in both genotypes, indicating functional
  auditory cortical input to the LA.
