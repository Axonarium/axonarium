paraphrase: Light pulses applied to ChR2-expressing thalamic axons within the LA evoked EPSCs in LA pyramidal cells; when
  only MGm was infected, 89% of recorded LA pyramidal neurons responded (84% with combined MGm+AuV infection, N = 50 cells).
  The responses were abolished by the broad glutamate receptor antagonist kynurenic acid in slices and reduced to ~15% of
  control by in vivo kynurenic acid infusion. In vivo, photostimulation of MGm produced field potentials in LA with a 12-ms
  latency.
