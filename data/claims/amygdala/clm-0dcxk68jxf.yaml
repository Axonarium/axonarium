paraphrase: Optogenetic activation of channelrhodopsin-expressing parvalbumin interneurons in the BLA, with light pulses or
  sinusoidal waveforms, produced both light-suppressed and light-activated single units in the same nucleus in vivo; the authors
  interpret the suppression as rapid synaptic inhibition of surrounding BLA neurons, with some cells showing rebound spiking.
  Spiking of BLA units became entrained to the phase of the 4 Hz and 8 Hz light waveforms.
