paraphrase: Blue-light stimulation of channelrhodopsin-expressing putative glutamatergic BLA neurons in freely moving rats
  evoked frequency-matched LFP responses in CA1 at 8, 20, 50 and 50/8 Hz, whereas control near-infrared light evoked no response.
  The CA1 peak followed the first light pulse at 12.7 ms versus 6.67 ms in the BLA (a 6.03 ms lag, interpreted as a monosynaptic
  BLA-to-CA1 drive); latencies after the final pulse were 14.0, 19.3, 16.0 and 9.33 ms for the 8, 20, 50 and 50/8 Hz conditions.
  Stimulation at 50 and 50/8 Hz significantly raised CA1 slow gamma power, and only 50/8 Hz stimulation significantly increased
  CA1 theta-gamma comodulation.
