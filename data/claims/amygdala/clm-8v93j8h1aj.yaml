paraphrase: In the right CeA of 3 mice, CGRP-immunoreactive terminals, which the authors treat as the parabrachial input,
  formed synapses mainly on dendrites (about 57%), and also on spines (about 24%) and somata (about 19%). Synapses were roughly
  evenly split between symmetric and asymmetric, and about two thirds of CGRP+ terminals co-expressed vGluT2. The parabrachial
  origin is inferred from the CGRP marker; it was not traced in this study.
