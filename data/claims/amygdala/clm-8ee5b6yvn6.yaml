paraphrase: 'In BNST slices from Crh-Cre rats with NpHR expressed in CeA CRF neurons, green-light inhibition of the CRF CeA-BNST
  terminals reduced action potential firing of BNST neurons (8 of 14 cells responded with reduced firing, 6 were non-responders;
  6.5 s light: 0.37 to 0.22 Hz; 5 min light: 0.91 to 0.60 Hz). Pretreatment with the CRF1 receptor antagonist R121919 itself
  lowered BNST firing and occluded the light effect, indicating the terminal influence on BNST firing is driven by CRF acting
  on CRF1 receptors.'
