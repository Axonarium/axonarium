paraphrase: Light activation of ChR2-expressing LC terminals in BLA slices evoked catecholamine transients with voltammetric
  signatures of norepinephrine (clearance t1/2 about 2 s) that fell to roughly a third of baseline after reserpine. In vivo,
  the same terminal stimulation raised firing in a fifth of recorded BLA units and suppressed firing in a smaller fraction,
  with long response latencies indicating a neuromodulatory rather than fast monosynaptic action, and increased BLA cFos relative
  to opsin-negative and contralateral controls; intra-BLA beta-adrenergic blockade abolished the behavioural consequence.
