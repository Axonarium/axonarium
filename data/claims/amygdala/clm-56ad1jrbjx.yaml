paraphrase: In slices, ChR2 stimulation of DCN axons evoked short-latency synaptic currents in intralaminar neurons. In CM/PF
  the currents were abolished by TTX and restored by 4-AP, showing they are monosynaptic, and they were also evoked in BLA-projecting
  CM/PF neurons labelled with CtB. Mean amplitudes were about 312 pA for the IL group, -197.5 pA in CM/PF and -104.1 pA in
  BLA-projecting CM/PF neurons.
